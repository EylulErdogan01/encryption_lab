name: encryption_lab
description: Şifreleme algoritmalarını basitçe anlatan ve deneten eğitim uygulaması.
version: 0.3.0+3
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  uses-material-design: true

  # Terminal görünümü için yazı tipi (SIL Open Font License, bkz. assets/fonts/OFL.txt)
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
